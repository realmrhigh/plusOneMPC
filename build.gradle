plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.8.10' // Or match your Kotlin version
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.example.kotlindrummachine"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.3.2' // Ensure this is compatible with your Kotlin version
    }
    namespace 'com.example.kotlindrummachine'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.7.0'
    implementation "androidx.compose.ui:ui:1.3.3" // Check for latest version
    implementation "androidx.compose.ui:ui-tooling-preview:1.3.3" // Check for latest version
    implementation "androidx.compose.material:material:1.3.1" // Check for latest version
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0" // Serialization
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.3.3" // Check for latest version
    debugImplementation "androidx.compose.ui:ui-tooling:1.3.3" // Check for latest version
}
